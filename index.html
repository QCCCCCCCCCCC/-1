<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>開學典禮生存大考驗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 min-h-screen text-white font-sans antialiased flex flex-col justify-center items-center p-4">

    <div id="quiz-container" class="w-full max-w-md bg-white/10 backdrop-blur-md rounded-3xl p-6 shadow-2xl border border-white/20 fade-in">
        
        <div id="start-view" class="text-center py-8">
            <div class="text-6xl mb-4">✨🎒🎯</div>
            <h1 class="text-2xl font-bold tracking-wider mb-2 bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent">
                新生生存指數大考驗
            </h1>
            <p class="text-gray-300 text-sm mb-8">測試你的校園求生基因！(隨機挑戰 10 題)</p>
            <input type="text" id="username" placeholder="輸入你的暱稱/名字" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/20 text-center text-white placeholder-gray-400 focus:outline-none focus:border-purple-400 mb-6">
            <button onclick="startQuiz()" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold py-3 rounded-xl shadow-lg shadow-purple-500/30 hover:opacity-90 transition active:scale-95">
                開始測驗
            </button>
        </div>

        <div id="question-view" class="hidden">
            <div class="w-full bg-white/10 h-1.5 rounded-full mb-6">
                <div id="progress-bar" class="bg-gradient-to-r from-pink-400 to-purple-500 h-1.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <h2 id="question-text" class="text-lg font-medium mb-6 leading-relaxed">題目載入中...</h2>
            <div id="options-container" class="space-y-3"></div>
        </div>

        <div id="result-view" class="hidden text-center py-4">
            <p class="text-sm text-purple-300 font-bold tracking-widest uppercase mb-1">測驗結果發表</p>
            <h3 id="result-user" class="text-xl font-bold mb-4">同學</h3>
            
            <div class="bg-gradient-to-b from-white/10 to-white/5 border border-white/10 rounded-2xl p-6 my-6 shadow-inner relative overflow-hidden">
                <div id="result-emoji" class="text-6xl mb-3">🗺️</div>
                <div id="result-title" class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-amber-400 mb-2">角色稱號</div>
                <div id="result-score" class="text-sm bg-white/10 text-gray-300 w-max mx-auto px-3 py-1 rounded-full mb-4">總分：0 分</div>
                <p id="result-desc" class="text-gray-300 text-sm leading-relaxed text-left bg-black/20 p-4 rounded-xl mb-4">描述文字</p>
                
                <div class="bg-white p-3 rounded-xl inline-block my-2 shadow-lg">
                    <div id="qrcode"></div>
                </div>
                <p class="text-xs text-purple-200 mt-2 font-medium">✨ 掃碼追蹤/加入我們，解鎖更多校園攻略 ✨</p>
            </div>

            <button onclick="location.reload()" class="w-full bg-white/10 text-white font-medium py-3 rounded-xl border border-white/20 hover:bg-white/20 transition active:scale-95 text-sm mb-3">
                再玩一次
            </button>
            <p class="text-xs text-gray-400">長按螢幕截圖，分享你的生存基因！</p>
        </div>

    </div>

    <script>
        // ==========================================
        // 🛠️ 1. 超過 30 種豐富題目庫 (每題答對得 10 分)
        // ==========================================
        const allQuestions = [
            { text: "傅鐘每次發出鐘聲會打幾下？", options: [{ text: "21下", score: 10 }, { text: "22下", score: 0 }, { text: "20下", score: 0 }] },
            { text: "臺大正門口最靠近哪一個捷運站？", options: [{ text: "公館站", score: 10 }, { text: "台電大樓站", score: 0 }, { text: "科技大樓站", score: 0 }] },
            { text: "哪一條路不屬於台大周邊或穿過校區，但學生極常去覓食（俗稱118巷）？", options: [{ text: "和平東路二段118巷", score: 10 }, { text: "羅斯福路118巷", score: 0 }, { text: "新生南路118巷", score: 0 }] },
            { text: "傳說中椰林大道兩側大約有多少棵大王椰子樹？", options: [{ text: "大約201棵", score: 10 }, { text: "大約100棵", score: 0 }, { text: "大約500棵", score: 0 }] },
            { text: "臺大校總區內（包含小福、鹿鳴等）目前總共有幾家全家便利商店？", options: [{ text: "4家", score: 10 }, { text: "2家", score: 0 }, { text: "6家", score: 0 }] },
            { text: "臺大總圖書館（非期末考考前週）平時開館到晚上幾點？", options: [{ text: "22:30", score: 10 }, { text: "21:00", score: 0 }, { text: "24:00", score: 0 }] },
            { text: "總圖討論室通常至少需要幾個人才能在線上系統成功預約？", options: [{ text: "3人", score: 10 }, { text: "2人", score: 0 }, { text: "5人", score: 0 }] },
            { text: "下列哪一棟「不是」臺大校內的共同教學館？", options: [{ text: "師大教學館", score: 10 }, { text: "博雅教學館", score: 0 }, { text: "新生教學館", score: 0 }] },
            { text: "目前台大新豐農場的三明治冰淇淋或小盒牛奶大約是多少錢？（依校內師生特價）", options: [{ text: "常見價格約 20~25 塊", score: 10 }, { text: "50 塊", score: 0 }, { text: "10 塊", score: 0 }] },
            { text: "常聽到的「臺大三寶」通常不包含下列哪一個？", options: [{ text: "醉月湖的醉雞", score: 10 }, { text: "傅鐘", score: 0 }, { text: "醉月湖的鵝（或大王椰子樹）", score: 0 }] },
            { text: "台大規定學士班學生畢業前，通常必須修滿多少通識學分？", options: [{ text: "15 學分", score: 10 }, { text: "30 學分", score: 0 }, { text: "6 學分", score: 0 }] },
            { text: "在校園內亂停腳踏車被水源杯拖吊後，要去哪裡領車？", options: [{ text: "水源拖吊場", score: 10 }, { text: "長興拖吊場", score: 0 }, { text: "公館派出所", score: 0 }] },
            { text: "傅鐘在白天的哪些時間點會打鐘？", options: [{ text: "每節下課與上課交替之際", score: 10 }, { text: "每小時整點", score: 0 }, { text: "只有中午12點", score: 0 }] },
            { text: "學生證不見了，第一時間要前往哪裡申請補辦？", options: [{ text: "教務處註冊組（第一行政大樓）", score: 10 }, { text: "學務處生活輔導組", score: 0 }, { text: "計算機中心", score: 0 }] },
            { text: "下列哪一家銀行「沒有」在台大校園內設立實體分行或大型辦事處？", options: [{ text: "花旗銀行", score: 10 }, { text: "華南銀行", score: 0 }, { text: "玉山銀行", score: 0 }] },
            { text: "台大的單身女學生宿舍「女四舍」地理位置在哪裡？", options: [{ text: "城中校區（醫學院旁）", score: 10 }, { text: "校總區小福旁", score: 0 }, { text: "長興街宿舍區", score: 0 }] },
            { text: "下列宿舍名稱中，哪一個目前「不是」台大現存的官方宿舍編號？", options: [{ text: "女七舍", score: 10 }, { text: "女一舍", score: 0 }, { text: "女九舍", score: 0 }] },
            { text: "台大校車（交通車）往返總區與醫學院，平日第一班車是幾點發車？", options: [{ text: "7:35", score: 10 }, { text: "8:00", score: 0 }, { text: "7:00", score: 0 }] },
            { text: "台大哪一年創校（前身為台北帝國大學）？", options: [{ text: "1928年", score: 10 }, { text: "1911年", score: 0 }, { text: "1945年", score: 0 }] },
            { text: "博雅教學館的英譯名稱是什麼？", options: [{ text: "Boya Lecture Building", score: 10 }, { text: "Liberal Arts Building", score: 0 }, { text: "Poya Hall", score: 0 }] },
            { text: "台大最著名的綜合體育館，學生通常私下稱呼它為什麼？", options: [{ text: "新體", score: 10 }, { text: "舊體", score: 0 }, { text: "巨蛋", score: 0 }] },
            { text: "傳說中晚上一個人去哪個地方散步，有機率會遇到黑冠麻鷺（大笨鳥）發出叫聲？", options: [{ text: "以上皆是（校園各草叢）", score: 10 }, { text: "只有醉月湖", score: 0 }, { text: "只有傅園", score: 0 }] },
            { text: "台大共同教育中心舉辦的熱門選課「森林育」通常在哪裡上課？", options: [{ text: "實驗林場（如溪頭）", score: 10 }, { text: "總圖後草皮", score: 0 }, { text: "植物園", score: 0 }] },
            { text: "台大最具代表性的校花是什麼？", options: [{ text: "杜鵑花", score: 10 }, { text: "玫瑰花", score: 0 }, { text: "向日葵", score: 0 }] },
            { text: "想吃台大著名的鬆餅屋，要走到哪一個廣場附近？", options: [{ text: "鹿鳴廣場", score: 10 }, { text: "小福廣場", score: 0 }, { text: "黑盒子廣場", score: 0 }] },
            { text: "台大學生經常用來交流、二手買賣、討論校園大小事的神秘FB社團是？", options: [{ text: "NTU台大學生交流板", score: 10 }, { text: "台大靠北版", score: 0 }, { text: "台大好人網", score: 0 }] },
            { text: "台大校徽上的主要幾種核心圖案，不包含下列哪一項？", options: [{ text: "腳踏車", score: 10 }, { text: "傅鐘", score: 0 }, { text: "大王椰子樹", score: 0 }] },
            { text: "台大的學號通常是由幾碼數字與英文組成的？", options: [{ text: "9碼", score: 10 }, { text: "8碼", score: 0 }, { text: "10碼", score: 0 }] },
            { text: "新生想影印講義、買文具，最常去的「小福」指的是什麼？", options: [{ text: "福利社食品文具部大樓", score: 10 }, { text: "土地公廟名稱", score: 0 }, { text: "某個教授的綽號", score: 0 }] },
            { text: "傳說中在台大只要期末考前做哪件事，該科就有可能會被二一（被當）？", options: [{ text: "爬上大王椰子樹（或數傅鐘）", score: 10 }, { text: "去總圖讀書", score: 0 }, { text: "吃台大牛奶冰棒", score: 0 }] },
            { text: "辛亥路側進入台大校區，最先看到的巍峨現代建築是哪一棟？", options: [{ text: "社科院（辜振甫先生紀念圖書館）", score: 10 }, { text: "綜合體育館", score: 0 }, { text: "文學院", score: 0 }] },
            { text: "台大網路選課系統中，志願抽選的最後一階段通常稱為？", options: [{ text: "加簽與網路第三階段", score: 10 }, { text: "隨機海選", score: 0 }, { text: "盲抽階段", score: 0 }] }
        ];

        // ==========================================
        // 🔗 2. 新生最後掃碼前往的 IG 網址
        // ==========================================
        const targetUrl = "https://www.instagram.com/ntu_act?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==";

        let quizQuestions = []; 
        let currentQuestionIndex = 0;
        let totalScore = 0;
        let playerObj = { name: "未知新生" };

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startQuiz() {
            const nameInput = document.getElementById('username').value.trim();
            if(!nameInput) {
                alert('請輸入一個暱稱！');
                return;
            }
            playerObj.name = nameInput;

            let shuffled = shuffle([...allQuestions]);
            quizQuestions = shuffled.slice(0, 10);

            quizQuestions.forEach(q => {
                q.options = shuffle([...q.options]);
            });

            currentQuestionIndex = 0;
            totalScore = 0;

            document.getElementById('start-view').classList.add('hidden');
            document.getElementById('question-view').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const currentQuestion = quizQuestions[currentQuestionIndex];
            const progress = (currentQuestionIndex / quizQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('question-text').innerText = `Q${currentQuestionIndex + 1}：${currentQuestion.text}`;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            currentQuestion.options.forEach(option => {
                const button = document.createElement('button');
                button.className = "w-full text-left bg-white/5 border border-white/10 p-4 rounded-xl hover:bg-white/10 active:bg-purple-500/20 transition duration-200 text-sm leading-relaxed";
                button.innerText = option.text;
                button.onclick = () => selectOption(option.score);
                container.appendChild(button);
            });
        }

        function selectOption(score) {
            totalScore += score;
            currentQuestionIndex++;
            if(currentQuestionIndex < quizQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('question-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = `100%`;

            document.getElementById('result-user').innerText = `【 ${playerObj.name} 】的專屬化身`;
            document.getElementById('result-score').innerText = `生存積分：${totalScore} 分 / 100分`;

            let emoji = "";
            let title = "";
            let desc = "";

            if (totalScore <= 40) {
                emoji = "🗺️";
                title = "迷途新生";
                desc = "「我是誰？我在哪？」你目前對台大校園的了解還停留在地圖階段，常常在椰林大道找不到活大。別擔心，多被水源阿伯拖吊幾次車，你就會自動解鎖隱藏捷徑了！";
            } else if (totalScore <= 80) {
                emoji = "🚴";
                title = "校園通勤族";
                desc = "幹得漂亮！你已經逐漸掌握了台大的生存節奏，腳踏車騎得飛快，知道小福跟鹿鳴廣場哪裡有好吃的，也知道總圖討論室怎麼揪人。再加把勁，你就能升級成台大老鳥了！";
            } else {
                emoji = "🎓";
                title = "台大校園大師";
                desc = "骨灰級台大玩家！選課套路、傅鐘二十一下、醉月湖的生態平衡你全部瞭若指掌。這校園基本上就是你的後花園，請接受新生的膜拜，你已經完全具備強大的生存基因！";
            }

            document.getElementById('result-emoji').innerText = emoji;
            document.getElementById('result-title').innerText = title;
            document.getElementById('result-desc').innerText = desc;

            // 產生 QR Code
            document.getElementById('qrcode').innerHTML = '';
            new QRCode(document.getElementById("qrcode"), {
                text: targetUrl,
                width: 128,
                height: 128,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }
    </script>
</body>
</html>
