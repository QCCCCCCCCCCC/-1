            { text: "台大的外語／語言課程通常主要安排在哪一個教學館上課？", options: [{ text: "共同教學館", score: 10 }, { text: "博雅教學館", score: 0 }, { text: "新生教學館", score: 0 }, { text: "普通教學館", score: 0 }] },
            { text: "往新店方向，捷運公館站的下一站是何者？", options: [{ text: "萬隆捷運站", score: 10 }, { text: "台電大樓捷運站", score: 0 }, { text: "景美捷運站", score: 0 }, { text: "大坪林捷運站", score: 0 }] },
            { text: "下列何者「非」台大附近的甜點／冰品店？", options: [{ text: "小南門豆花", score: 10 }, { text: "雪腐", score: 0 }, { text: "鴉片粉圓", score: 0 }, { text: "搗飛豆花", score: 0 }] },
            { text: "下列何者「非」公館台大附近的拉麵店？", options: [{ text: "麵屋千雲", score: 10 }, { text: "麵屋長樂", score: 0 }, { text: "小高拉麵", score: 0 }, { text: "隱家拉麵", score: 0 }] },
            { text: "捷運公館站的進站／到站音樂源自於哪一首經典名曲？", options: [{ text: "蕭邦夜曲", score: 10 }, { text: "德布西月光", score: 0 }, { text: "卡農", score: 0 }, { text: "莫札特小奏鳴曲", score: 0 }] },
            { text: "何者「非」鄰近台大周邊的捷運站？", options: [{ text: "大橋頭", score: 10 }, { text: "科技大樓", score: 0 }, { text: "台電大樓", score: 0 }, { text: "萬隆", score: 0 }] },
            { text: "台大校園如遇大雨積水，最常出現在路面或草皮上的魚類為何？", options: [{ text: "土虱", score: 10 }, { text: "鯽魚", score: 0 }, { text: "鯉魚", score: 0 }, { text: "吳郭魚", score: 0 }] },
            { text: "台大校園內唯一能開放一般汽車行車的橋樑位在哪一條路上？", options: [{ text: "舟山路", score: 10 }, { text: "椰林大道", score: 0 }, { text: "蒲葵道", score: 0 }, { text: "桃花源道", score: 0 }] },
            { text: "NTU 除了是台大的英文簡寫外，亦是新加坡哪一所大學的英文簡稱？", options: [{ text: "南洋理工大學", score: 10 }, { text: "新加坡國立大學", score: 0 }, { text: "南洋科技大學", score: 0 }, { text: "新加坡管理大學", score: 0 }] },
            { text: "下列何者「非」台大真實存在的學生社團？", options: [{ text: "新心靈社", score: 10 }, { text: "皮繩愉虐社", score: 0 }, { text: "同性戀社", score: 0 }, { text: "合氣道社", score: 0 }] }
        ];

        // ==========================================
        // 🔗 掃碼前往的 IG 網址
        // ==========================================
        const targetUrl = "https://www.instagram.com/ntu_act?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==";

        let quizQuestions = []; 
        let userAnswers = [];
        let currentQuestionIndex = 0;
        let totalScore = 0;
        let playerObj = { name: "未知新生" };

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startQuiz() {
            const nameInput = document.getElementById('username').value.trim();
            if(!nameInput) {
                alert('請輸入一個暱稱！');
                return;
            }
            playerObj.name = nameInput;

            let shuffled = shuffle([...allQuestions]);
            quizQuestions = shuffled.slice(0, 10);

            quizQuestions.forEach(q => {
                q.options = shuffle([...q.options]);
            });

            currentQuestionIndex = 0;
            totalScore = 0;
            userAnswers = [];

            document.getElementById('start-view').classList.add('hidden');
            document.getElementById('question-view').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const currentQuestion = quizQuestions[currentQuestionIndex];
            const progress = (currentQuestionIndex / quizQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('question-text').innerText = `Q${currentQuestionIndex + 1}：${currentQuestion.text}`;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            currentQuestion.options.forEach(option => {
                const button = document.createElement('button');
                button.className = "w-full text-left bg-white border border-teal-100 p-4 rounded-xl hover:bg-teal-50 active:bg-teal-100 transition duration-200 text-sm leading-relaxed text-slate-700 font-medium shadow-sm hover:border-teal-300";
                button.innerText = option.text;
                button.onclick = () => selectOption(option);
                container.appendChild(button);
            });
        }

        function selectOption(selectedOption) {
            totalScore += selectedOption.score;
            userAnswers.push(selectedOption);

            currentQuestionIndex++;
            if(currentQuestionIndex < quizQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('question-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = `100%`;

            document.getElementById('result-user').innerText = `【 ${playerObj.name} 】的專屬化身`;
            document.getElementById('result-score').innerText = `生存積分：${totalScore} 分 / 100分`;

            let imageSrc = "";
            let title = "";
            let desc = "";

            // 🎯 分數判斷邏輯（40-60分、61-80分、81-100分）
            if (totalScore <= 60) {
                imageSrc = "S__112943108_0.jpg";
                title = "迷途新生";
                desc = "「我是誰？我在哪？」你目前對台大校園的了解還停留在地圖階段，常常在椰林大道找不到活大。別擔心，多被水源阿伯拖吊幾次車，你就會自動解鎖隱藏捷徑了！";
            } else if (totalScore <= 80) {
                imageSrc = "S__112943109_0.jpg";
                title = "校園通勤族";
                desc = "幹得漂亮！你已經逐漸掌握了台大的生存節奏，腳踏車騎得飛快，知道小福跟鹿鳴廣場哪裡有好吃的，也知道總圖討論室怎麼揪人。再加把勁，你就能升級成台大老鳥了！";
            } else {
                imageSrc = "S__112943110_0.jpg";
                title = "台大校園大師";
                desc = "骨灰級台大玩家！選課套路、傅鐘二十一下、醉月湖的生態平衡你全部瞭若指掌。這校園基本上就是你的後花園，請接受新生的膜拜，你已經完全具備強大的生存基因！";
            }

            document.getElementById('result-emoji').src = imageSrc;
            document.getElementById('result-title').innerText = title;
            document.getElementById('result-desc').innerText = desc;

            // 渲染獨立題目與全選項標示對錯
            renderAnswersReview();

            // 產生 QR Code
            document.getElementById('qrcode').innerHTML = '';
            new QRCode(document.getElementById("qrcode"), {
                text: targetUrl,
                width: 128,
                height: 128,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        // 獨立展現題目與所有選項（紅框表錯誤、綠框表正確）
        function renderAnswersReview() {
            const container = document.getElementById('answers-review-container');
            container.innerHTML = '';

            quizQuestions.forEach((q, idx) => {
                const userChoice = userAnswers[idx];

                const card = document.createElement('div');
                card.className = "p-4 bg-white/90 rounded-2xl border border-teal-100 shadow-sm text-sm";

                let optionsHTML = '';
                q.options.forEach(opt => {
                    const isCorrect = opt.score > 0;
                    const isUserPicked = opt.text === userChoice.text;

                    let styleClasses = "bg-slate-50 border-slate-200 text-slate-600"; 

                    if (isCorrect) {
                        styleClasses = "bg-emerald-50 border-2 border-emerald-500 text-emerald-800 font-bold";
                    } else if (isUserPicked && !isCorrect) {
                        styleClasses = "bg-rose-50 border-2 border-rose-500 text-rose-800 font-bold";
                    }

                    let badge = '';
                    if (isCorrect && isUserPicked) {
                        badge = ' <span class="text-xs bg-emerald-200 text-emerald-800 px-2 py-0.5 rounded-full ml-auto font-bold">✓ 你的選擇 (正確)</span>';
                    } else if (isUserPicked && !isCorrect) {
                        badge = ' <span class="text-xs bg-rose-200 text-rose-800 px-2 py-0.5 rounded-full ml-auto font-bold">✗ 你的選擇 (錯誤)</span>';
                    } else if (isCorrect) {
                        badge = ' <span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full ml-auto">★ 正確答案</span>';
                    }

                    optionsHTML += `
                        <div class="p-3 rounded-xl border flex items-center justify-between gap-2 text-xs leading-relaxed ${styleClasses}">
                            <span>${opt.text}</span>
                            ${badge}
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="font-bold text-slate-800 mb-3 text-sm">
                        Q${idx + 1}. ${q.text}
                    </div>
                    <div class="space-y-2">
                        ${optionsHTML}
                    </div>
                `;

                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
